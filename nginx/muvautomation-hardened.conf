```nginx
# nginx/muvautomation-hardened.conf

# Limitar solicitudes por dirección IP.
# Este bloque debe estar dentro del contexto http {} de Nginx.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream alerts_api {
    server 127.0.0.1:3001;
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/muvautomation/app/web-frontend/public;
    index index.html;
    server_name _;

    # Ocultar información de la versión de Nginx.
    server_tokens off;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-XSS-Protection "0" always;

    # Deshabilitar listado de directorios.
    autoindex off;

    access_log /var/log/nginx/muvautomation_access.log;
    error_log /var/log/nginx/muvautomation_error.log;

    # Bloquear archivos y rutas ocultas, excepto los recursos
    # necesarios para ACME si se utiliza ese mecanismo.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # API: Nginx actúa como punto de entrada.
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://alerts_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Frontend estático.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
```

