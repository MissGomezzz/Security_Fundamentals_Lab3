upstream alerts_api { server 127.0.0.1:3001; }

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/muvautomation/app/web-frontend/public;
    index index.html;
    server_name _;
    access_log /var/log/nginx/muvautomation_access.log;
    error_log /var/log/nginx/muvautomation_error.log;

    location /api/ {
        proxy_pass http://alerts_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / { try_files $uri $uri/ /index.html; }
}
